<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Tracker Quick Add — Settings</title>
    <style>
      body {
        font: 14px -apple-system, system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
        color: #111113;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      p.hint {
        color: #666;
        margin-top: 0;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input[type="url"] {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      button {
        margin-top: 12px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid #111113;
        background: #111113;
        color: #fafafa;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.9;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
      }
      #status.error {
        color: #b91c1c;
      }
      #status.saved {
        color: #15803d;
      }
    </style>
  </head>
  <body>
    <h1>Job Tracker Quick Add</h1>
    <p class="hint">
      Your Job Tracker instance's URL — pre-filled from how the extension was built. Only change
      this if you actually want to point it somewhere else; it's only used to open the "add job"
      popup, nothing is sent anywhere else.
    </p>
    <form id="form">
      <label for="appUrl">Job Tracker URL</label>
      <input
        id="appUrl"
        type="url"
        placeholder="https://jobs.example.com"
        required
        autocomplete="off"
      />
      <div>
        <button type="submit">Save</button>
      </div>
      <p id="status"></p>
    </form>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
